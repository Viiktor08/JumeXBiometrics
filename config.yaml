# Configuración del sistema biométrico JumeXBiometrics.
#
# Las rutas relativas se resuelven respecto a la carpeta de ESTE fichero.
# Se puede usar otro fichero con la variable de entorno BIOMETRIA_CONFIG.
#
# Los umbrales están calibrados para ArcFace con scripts/evaluar.py sobre LFW
# (392 personas, 1173 pares genuinos y 615 432 impostores; EER 0,68 % en 0.158).
# Si se cambia de extractor HAY QUE RECALIBRARLOS: cada técnica puntúa distinto.

detector:
  modelo: models/face_detection_yunet_2023mar.onnx
  umbral_confianza: 0.8   # puntuación mínima de YuNet para aceptar una cara
  umbral_nms: 0.3         # supresión de no-máximos entre detecciones solapadas
  varias_caras: error     # "error" -> rechaza la foto | "mayor" -> usa la cara más grande

preprocesado:
  tam_cara: [112, 112]    # [ancho, alto] de la cara alineada que recibe el extractor

calidad:
  tam_min_cara: 60          # lado mínimo (px) de la caja de la cara en la imagen original
  umbral_borrosidad: 50.0   # varianza del Laplaciano mínima sobre la cara alineada

extractor:
  nombre: arcface         # extractor registrado en biometria/extractores: arcface (el asignado), sface, lbp
  parametros:             # se pasan tal cual al constructor del extractor
    modelo: models/arcface_w600k_r50.onnx
    voltear: true         # suma el vector de la cara volteada (más robusto, el doble de lento)

bd:
  ruta: data/bd.csv
  # Clave HMAC para la integridad del CSV. Tiene prioridad la variable de
  # entorno BIOMETRIA_HMAC_KEY; si no existe, se lee este fichero (fuera de git).
  ruta_clave: data/clave_hmac.key
  cifrar_templates: false   # true -> templates cifrados con AES-GCM en el CSV
  agregacion: max           # cómo combinar varias muestras de una persona: max | media

umbrales:
  verificacion: 0.35        # mínimo para aceptar en verificar*  (LFW: FAR 0,0005 %, FRR 0,85 %)
  identificacion: 0.40      # mínimo para no devolver "desconocido" (LFW: FAR 0,0005 %, FRR 1,0 %)
  # Solo para mostrar (web): por debajo, un candidato "no se parece" y no se lista
  # entre los más parecidos. Dos desconocidos lo superan en el 0,0018 % de los pares
  # (y con 392 personas en la BD, el 2.º candidato de un inscrito solo en el 1 % de casos).
  parecido: 0.30

limites:
  max_bytes_imagen: 10485760   # 10 MiB: fichero de imagen máximo aceptado
  max_pixeles: 25000000        # 25 Mpx: protege frente a "bombas" de descompresión
  max_muestras_por_id: 10      # muestras máximas por persona en la BD

defensa:
  # Contramedidas frente a ataques (ver THREAT_MODEL.md). Se pueden poner a 0 para
  # medir el sistema sin ellas o para no romper la interoperabilidad del enunciado.
  coherencia_muestra: 0.20   # al AÑADIR una muestra a alguien que ya existe, debe
                             # parecerse a las suyas (LFW: rechaza 1,1 % de muestras
                             # legítimas, bloquea 99,9 % de caras ajenas). 0 = desactivado.
  # Contra el ajuste automático de un template por los métodos _t (hill-climbing):
  decimales_puntuacion_t: 2  # la puntuación que sale por _t se redondea a 2 decimales
  max_intentos_t: 50         # máx. comparaciones _t por id en la ventana (0 = sin límite)
  ventana_intentos_s: 60     # ventana del límite anterior, en segundos
